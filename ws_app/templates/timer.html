<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Таймер</title>
</head>
<body>
    <h1>Щас подорвет: <span id="display">—</span> сек.</h1>
    <p>ID таймера: {{ room_name }}</p>

    <script>
        const roomName = "{{ room_name }}"; 

        const urlParams = new URLSearchParams(window.location.search);
        const seconds = parseInt(urlParams.get('seconds') || '0', 10);

        const ws = new WebSocket(`ws://${window.location.host}/ws/timer/${roomName}`);

        ws.onopen = () => {
            ws.send(String(seconds));
        };

        ws.onmessage = (event) => {
            const value = parseInt(event.data, 10);
            document.getElementById('display').textContent = value;
            if (value === 0) {
                ws.close();
            }
        };
    </script>
</body>
</html>
